<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3efe8;color:#493d35;font:15px system-ui}.card{text-align:center;padding:24px}h1{font-size:24px;margin:0 0 8px}.hint{color:#7d6d61;margin:0 0 8px}canvas{display:block;width:min(512px,85vw);height:auto;margin:auto}button,select{font:inherit;padding:9px 14px;margin:5px;border:1px solid #cdbbaa;border-radius:10px;background:#fffaf4;color:#493d35}button:disabled{opacity:.5}.primary{background:#674f42;color:white;border-color:#674f42}input{width:min(440px,80vw);margin:14px auto 8px;display:block}.status{min-height:24px;font-variant-numeric:tabular-nums}.dark{background:#252936;color:#eee}.dark .hint{color:#c3b6ac}</style>
<main class="card"><h1>待机 → 工作 → 待机</h1><p class="hint">电脑轻轻出现，目光落向屏幕</p><canvas width="512" height="512"></canvas><div class="status" id="status">载入中…</div><div><button class="primary" id="toggle" disabled>开始工作</button><button id="demo" disabled>完整演示</button><button id="pause" disabled>暂停</button></div><div><select id="speed"><option value="1">正常速度</option><option value=".5">半速查看</option></select><button id="bg">切换背景</button></div><input id="scrub" type="range" min="0" max="9900" value="0" disabled></main>
<script>// Shared deterministic timing for the exported demo and interactive preview.
// This candidate controller is independent of the desktop application's state.
(function(root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.WorkTransition = api;
})(typeof globalThis === 'object' ? globalThis : this, function() {
  const transitionMs = 400, workLoopMs = 9600, breathPeriodMs = 4800;
  const blinkStarts = [1250, 6700], blinkMs = 375, gazeSteps = 32;
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => { x = clamp(x); return x*x*x*(10+x*(-15+6*x)); };
  const mod = (x, d) => { const r = x % d; return r < 0 ? r + d : r; };
  function breathing(t) {
    const w = 2*Math.PI/breathPeriodMs;
    return { y:Math.cos(w*t)-1, velocity:-w*Math.sin(w*t), acceleration:-w*w*Math.cos(w*t) };
  }
  function blinkAt(t) {
    const local = mod(t, workLoopMs);
    for (const start of blinkStarts) {
      const elapsed = local-start;
      if (elapsed >= 0 && elapsed < blinkMs) {
        const phase = elapsed < 140 ? 32*elapsed/140 : elapsed < 157 ? 32 : 32+32*(elapsed-157)/218;
        return { index:Math.round(phase), elapsed, remaining:blinkMs-elapsed };
      }
    }
    return null;
  }
  // Continue the original breathing clock while smoothly reducing its range.
  // The quintic envelope matches position/velocity/acceleration at both ends.
  function exitOffset(workTime, elapsed) {
    return breathing(workTime+Math.max(0,elapsed)).y*(1-ease(elapsed/transitionMs));
  }
  function createController() {
    let state='idle', since=0, workStart=0, pendingExitAt=null, exitWorkTime=0;
    function advance(now) {
      if (state==='entering' && now >= since+transitionMs) {
        workStart=since+transitionMs; since=workStart; state='working';
      }
      if (state==='working' && pendingExitAt!==null && now>=pendingExitAt) {
        since=pendingExitAt; exitWorkTime=since-workStart; pendingExitAt=null; state='exiting';
      }
      if (state==='exiting' && now>=since+transitionMs) {
        since+=transitionMs; state='idle';
      }
    }
    function begin(now) {
      advance(now);
      if (state!=='idle') return false;
      state='entering';since=now;pendingExitAt=null;return true;
    }
    function finish(now) {
      advance(now);
      if (state!=='working' || pendingExitAt!==null) return false;
      const blink=blinkAt(now-workStart);
      pendingExitAt=now+(blink?blink.remaining:0);
      advance(now);return true;
    }
    function sample(now) {
      advance(now);
      if(state==='idle') return {state,gazeIndex:0,blinkIndex:null,propsOpacity:0,dy:0,waitingForBlink:false};
      if(state==='entering') {
        const q=ease((now-since)/transitionMs);
        return {state,gazeIndex:Math.round(gazeSteps*q),blinkIndex:null,propsOpacity:q,dy:0,waitingForBlink:false};
      }
      if(state==='working') {
        const workTime=now-workStart, blink=blinkAt(workTime);
        return {state,gazeIndex:gazeSteps,blinkIndex:blink?.index??null,propsOpacity:1,dy:breathing(workTime).y,workTime,waitingForBlink:pendingExitAt!==null};
      }
      const elapsed=now-since,q=ease(elapsed/transitionMs);
      return {state,gazeIndex:Math.round(gazeSteps*(1-q)),blinkIndex:null,propsOpacity:1-q,dy:exitOffset(exitWorkTime,elapsed),exitWorkTime,waitingForBlink:false};
    }
    return {begin,finish,sample};
  }
  const demo = {idleMs:1000,enterMs:transitionMs,exitRequestWorkMs:6800,exitStartWorkMs:7075,durationMs:9900};
  function demoAt(time) {
    const t=Math.max(0,Math.min(demo.durationMs,time)),c=createController();
    if(t>=demo.idleMs)c.begin(demo.idleMs);
    const requestAt=demo.idleMs+transitionMs+demo.exitRequestWorkMs;
    if(t>=requestAt)c.finish(requestAt);
    return c.sample(t);
  }
  return {transitionMs,workLoopMs,breathPeriodMs,blinkStarts,blinkMs,gazeSteps,ease,breathing,blinkAt,exitOffset,createController,demo,demoAt};
});
</script><script>

blink/blink-27.png","../work-preview-v3/blink/blink-28.png","../work-preview-v3/blink/blink-29.png","../work-preview-v3/blink/blink-30.png","../work-preview-v3/blink/blink-31.png","../work-preview-v3/blink/blink-32.png","../work-preview-v3/blink/blink-33.png","../work-preview-v3/blink/blink-34.png","../work-preview-v3/blink/blink-35.png","../work-preview-v3/blink/blink-36.png","../work-preview-v3/blink/blink-37.png","../work-preview-v3/blink/blink-38.png","../work-preview-v3/blink/blink-39.png","../work-preview-v3/blink/blink-40.png","../work-preview-v3/blink/blink-41.png","../work-preview-v3/blink/blink-42.png","../work-preview-v3/blink/blink-43.png","../work-preview-v3/blink/blink-44.png","../work-preview-v3/blink/blink-45.png","../work-preview-v3/blink/blink-46.png","../work-preview-v3/blink/blink-47.png","../work-preview-v3/blink/blink-48.png","../work-preview-v3/blink/blink-49.png","../work-preview-v3/blink/blink-50.png","../work-preview-v3/blink/blink-51.png","../work-preview-v3/blink/blink-52.png","../work-preview-v3/blink/blink-53.png","../work-preview-v3/blink/blink-54.png","../work-preview-v3/blink/blink-55.png","../work-preview-v3/blink/blink-56.png","../work-preview-v3/blink/blink-57.png","../work-preview-v3/blink/blink-58.png","../work-preview-v3/blink/blink-59.png","../work-preview-v3/blink/blink-60.png","../work-preview-v3/blink/blink-61.png","../work-preview-v3/blink/blink-62.png","../work-preview-v3/blink/blink-63.png","../work-preview-v3/blink/blink-64.png"],"props":"../work-preview-v3/props.png"},M=WorkTransition,cache=new Map(),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const toggle=document.getElementById('toggle'),demoButton=document.getElementById('demo'),pauseButton=document.getElementById('pause'),scrub=document.getElementById('scrub'),status=document.getElementById('status');
let ready=false,mode='demo',time=0,last=null,paused=false,controller=M.createController(),lastState=null;
function sample(){return mode==='demo'?M.demoAt(time):controller.sample(time)}
function draw(){if(!ready)return;const s=sample();lastState=s;ctx.clearRect(0,0,512,512);ctx.globalAlpha=1;ctx.drawImage(cache.get(s.blinkIndex===null?assets.gazeFiles[s.gazeIndex]:assets.blinkFiles[s.blinkIndex]),0,s.dy);if(s.propsOpacity>0){ctx.globalAlpha=s.propsOpacity;ctx.drawImage(cache.get(assets.props),0,0);ctx.globalAlpha=1}status.textContent=s.waitingForBlink?'等这次眨眼结束，即刻返回待机':({idle:'待机',entering:'进入工作',working:'陪你工作中',exiting:'返回待机'})[s.state];toggle.textContent=s.state==='idle'?'开始工作':s.waitingForBlink?'睁眼后返回':'返回待机';toggle.disabled=!['idle','working'].includes(s.state)||s.waitingForBlink;pauseButton.textContent=paused?'继续':'暂停';scrub.disabled=mode!=='demo';if(mode==='demo')scrub.value=time;}
toggle.onclick=()=>{if(!ready)return;const s=sample();if(mode==='demo'){controller=M.createController();if(s.state==='working')controller.begin(time-s.workTime-M.transitionMs);mode='live'}if(s.state==='idle')controller.begin(time);else if(s.state==='working')controller.finish(time);paused=false;last=null;draw()};
demoButton.onclick=()=>{mode='demo';time=0;paused=false;last=null;draw()};pauseButton.onclick=()=>{paused=!paused;last=null;draw()};scrub.oninput=()=>{mode='demo';time=+scrub.value;paused=true;last=null;draw()};document.getElementById('bg').onclick=()=>document.body.classList.toggle('dark');document.addEventListener('visibilitychange',()=>last=null);
function tick(now){const delta=last===null?0:Math.min(now-last,100);last=now;if(ready&&!paused&&!document.hidden){time+=delta*+document.getElementById('speed').value;if(mode==='demo'&&time>=M.demo.durationMs){time=M.demo.durationMs;paused=true}draw()}requestAnimationFrame(tick)}
(async()=>{try{const files=[...new Set([...assets.gazeFiles,...assets.blinkFiles,assets.props])];let n=0;await Promise.all(Array.from({length:4},async()=>{while(n<files.length){const f=files[n++],img=new Image();img.src=f;await img.decode();cache.set(f,img)}}));ready=true;demoButton.disabled=false;pauseButton.disabled=false;draw();requestAnimationFrame(tick)}catch(e){status.textContent='预览载入失败：'+e.message}})();
